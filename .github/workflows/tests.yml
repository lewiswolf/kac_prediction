name: Tests

on:
    push:
        branches: [master]
    pull_request:
        branches: [master]

env:
    WANDB_MODE: offline

jobs:
    installation:
        runs-on: ${{ matrix.os }}
        strategy:
            matrix:
                # os: [macos-latest, ubuntu-latest, windows-latest]
                # python: ["3.11", "3.12", "3.13", "3.14"]
                os: [macos-latest]
                python: ["3.14"]

        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-python@v7
              with:
                  python-version: ${{ matrix.python }}

            - name: Test installation
              run: pip install "git+https://github.com/lewiswolf/kac_prediction.git"

    all-tests:
        runs-on: ${{ matrix.os }}
        strategy:
            matrix:
                # os: [macos-latest, ubuntu-latest, windows-latest]
                # python: ["3.11", "3.12", "3.13", "3.14"]
                os: [macos-latest]
                python: ["3.14"]

        steps:
            - uses: actions/checkout@v7
              with:
                  submodules: recursive
            - uses: actions/setup-python@v7
              with:
                  python-version: ${{ matrix.python }}
            - uses: actions/cache@v6
              id: cache-pipenv
              with:
                  path: ~/.local/share/virtualenvs
                  key: ${{ runner.os }}-python-${{ steps.setup-python.outputs.python-version }}-pipenv-${{ hashFiles('Pipfile.lock') }}

            - name: Install pipenv
              run: |
                python -m pip install --upgrade pip pipenv setuptools wheel

            - name: Install python dependencies
              run: pipenv install -d --python ${{ matrix.python }}

            - name: Lint project
              run: |
                if [ "${{ matrix.python }}" = "3.11" ]; then
                  pipenv run flake8
                else
                  pipenv run flake8 --extend-ignore=Q000
                fi

            - name: Assert types
              run: pipenv run mypy

            - name: Run unit tests
              run: pipenv run python test/test.py
